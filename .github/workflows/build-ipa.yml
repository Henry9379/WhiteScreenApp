name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project WhiteScreenApp.xcodeproj -scheme WhiteScreenApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WhiteScreenApp.app Payload/
          zip -r WhiteScreenApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WhiteScreenApp-IPA
          path: WhiteScreenApp.ipa
